<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Instagram Demo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fafafa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .container {
            width: 350px;
        }

        .warning {
            padding: 11px;

            margin-bottom: 12px;

            border: 1px solid #ffe69c;

            border-radius: 4px;

            background: #fff3cd;

            color: #664d03;

            text-align: center;

            font-size: 13px;
        }

        .login-box {
            background: white;

            border: 1px solid #dbdbdb;

            padding: 40px 35px;

            text-align: center;
        }

        .logo {
            margin-bottom: 30px;

            font-size: 32px;

            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 11px;

            margin: 4px 0;

            border: 1px solid #dbdbdb;

            border-radius: 4px;

            background: #fafafa;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #aaa;
        }

        button {
            width: 100%;

            margin-top: 12px;

            padding: 10px;

            border: none;

            border-radius: 7px;

            background: #3897f0;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .demo-note {
            margin-top: 22px;

            color: #777;

            font-size: 12px;

            line-height: 1.5;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="warning">
            DEMO ONLY — Not affiliated with Instagram
        </div>

        <div class="login-box">

            <div class="logo">
                Instagram Demo
            </div>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    autocomplete="off"
                    required
                >

                <!--
                    IMPORTANT:
                    No "name" attribute.
                    Therefore this password is NOT submitted
                    to the Flask server.
                -->

                <input
                    type="password"
                    placeholder="Demo password"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            <div class="demo-note">
                Educational training interface.<br>
                Passwords are never collected.
            </div>

        </div>

    </div>

</body>

</html>
